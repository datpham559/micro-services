spring:
  cloud:
    inetutils:
      preferred-networks: 127.0.0.1
  thymeleaf:
    check-template-location: false
server:
  port: 1115

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    registerWithEureka: true
    fetchRegistry: true

ribbon:
  eureka:
    enabled: true

info:
  app:
    name: Monitor Application
    description: This is a sample application about Monitor.
    version: 1.0.0

management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true