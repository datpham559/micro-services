spring:
  application:
    name: configService
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/shared
server:
  port: 9999

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    registerWithEureka: true
    fetchRegistry: true